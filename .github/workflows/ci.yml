name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check plugin manifest versions
        run: bun run check:plugin-version

      - name: Validate skills
        run: bun run check:skills

      - name: Run tests
        run: bun run test

      - name: Type-check package
        run: bun run type-check

      - name: Build package
        run: bun run build

      - name: Verify package contents
        run: |
          bun pm pack --ignore-scripts --filename "$RUNNER_TEMP/sim-skills.tgz" --quiet
          scripts/verify-package.sh "$RUNNER_TEMP/sim-skills.tgz"
