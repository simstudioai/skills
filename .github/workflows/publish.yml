name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'src/**'
      - 'skills/**'
      - 'scripts/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - 'tsconfig*'
      # A change to how the package is built or published has to republish it.
      - '.github/workflows/publish.yml'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Keeps package.json's version when it is ahead of npm (or nothing is
      # published yet); otherwise takes the highest published patch plus one.
      - name: Auto-bump package version
        run: bun run release:version

      # Both plugin manifests ship inside the tarball, so they must carry the
      # version being published, not the committed one.
      - name: Sync plugin manifest versions
        run: bun run sync:plugin-version

      - name: Read release version
        id: version
        run: echo "version=$(bun -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate skills
        run: bun run check:skills

      - name: Run tests
        run: bun run test

      - name: Type-check package
        run: bun run type-check

      - name: Build package
        run: bun run build

      # The publish job ships this exact tarball, so what was verified is what
      # ships.
      - name: Pack package
        run: bun pm pack --ignore-scripts --filename "$RUNNER_TEMP/package.tgz" --quiet

      - name: Verify package contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/verify-package.sh "$RUNNER_TEMP/package.tgz"
          for manifest in package/package.json package/.claude-plugin/plugin.json package/.codex-plugin/plugin.json; do
            PACKED_VERSION="$(tar -xzOf "$RUNNER_TEMP/package.tgz" "$manifest" | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).version)')"
            if [ "$PACKED_VERSION" != "$VERSION" ]; then
              echo "$manifest has version '$PACKED_VERSION', expected '$VERSION'." >&2
              exit 1
            fi
          done

      - name: Verify version is unpublished
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if bun pm view "sim-skills@$VERSION" version > /dev/null 2>&1; then
            echo "sim-skills@$VERSION is already published. The automatic version bump did not produce a unique release." >&2
            exit 1
          fi

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error
          retention-days: 1

  # npm trusted publishing trades this job's OIDC token for a short-lived npm
  # credential, so no npm token is stored anywhere. Only this job can mint one,
  # and it runs no repository code: it publishes the tarball the build job
  # verified. npm runs no lifecycle scripts for a tarball, and provenance is
  # attached automatically.
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      # Node 24 bundles npm 11.5.1+, which trusted publishing requires.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}

      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP/package.tgz" --access public --tag latest

      - name: Summarize release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: echo "Published sim-skills@$VERSION with the 'latest' tag."

  release:
    name: release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
